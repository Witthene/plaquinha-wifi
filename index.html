<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaquinha Wi-Fi — Gerador</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root { --bg:#0a0a0c; --panel:#121216; --panel2:#18181d; --line:#26262d; --y:#ffd400; --g:#b6ff00; --pink:#ff3d7f; --txt:#f4f4f4; --mut:#8f8f99; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 999; background: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .06; background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 14px 14px; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 2px solid var(--y); background: rgba(10,10,12,.85); }
  header svg { width: 30px; height: 30px; fill: var(--y); }
  header h1 { font-family: 'Anton'; font-weight: 400; font-size: 26px; letter-spacing: 1px; text-transform: uppercase; }
  header h1 b { background: var(--y); color: #000; padding: 0 8px; display: inline-block; transform: skew(-10deg); font-weight: 400; }
  header span { margin-left: auto; font-family: 'JetBrains Mono'; font-size: 12px; color: var(--g); display: flex; align-items: center; gap: 8px; }
  header span i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: pisca 1.2s infinite; }
  @keyframes pisca { 50% { opacity: .2; } }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 420px; overflow-y: auto; padding: 22px; border-right: 2px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
  aside::-webkit-scrollbar { width: 6px; } aside::-webkit-scrollbar-thumb { background: var(--y); }
  section { counter-increment: sec; background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 2px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%); }
  section::after { content: ""; position: absolute; top: 0; right: 0; width: 20px; height: 20px; background: var(--y); clip-path: polygon(0 0, 100% 100%, 100% 0); }
  section h2 { font-family: 'Anton'; font-weight: 400; font-size: 24px; text-transform: uppercase; letter-spacing: .5px; display: flex; align-items: baseline; gap: 10px; }
  section h2::before { content: "0" counter(sec); font-size: 30px; color: transparent; -webkit-text-stroke: 1.5px var(--y); }
  label { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--mut); display: flex; flex-direction: column; gap: 6px; text-transform: uppercase; letter-spacing: .5px; }
  input, select { padding: 10px 12px; border: 2px solid var(--line); background: var(--bg); color: var(--txt); font: 500 15px 'Space Grotesk', sans-serif; outline: none; transition: border .15s; border-radius: 0; }
  input:focus, select:focus { border-color: var(--y); box-shadow: 0 0 0 1px var(--y); }
  .linha { display: flex; gap: 10px; } .linha > * { flex: 1; }
  .toggle { flex-direction: row; align-items: center; justify-content: space-between; color: var(--txt); cursor: pointer; }
  .toggle input { appearance: none; width: 42px; height: 22px; background: var(--line); position: relative; cursor: pointer; padding: 0; border: 0; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .toggle input::after { content: ""; position: absolute; top: 4px; left: 6px; width: 14px; height: 14px; background: var(--mut); transition: .15s; }
  .toggle input:checked { background: var(--y); } .toggle input:checked::after { left: 22px; background: #000; }
  .modelos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .modelo { background: var(--bg); border: 2px solid var(--line); padding: 6px; cursor: pointer; text-align: center; font-family: 'JetBrains Mono'; font-size: 11px; color: var(--mut); transition: .2s; }
  .modelo:hover { border-color: var(--mut); transform: translateY(-2px); }
  .modelo canvas { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; margin-bottom: 4px; }
  .modelo.ativo { border-color: var(--y); color: var(--y); box-shadow: 4px 4px 0 var(--pink); }
  .cores { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cor { width: 30px; height: 30px; cursor: pointer; border: 2px solid transparent; transform: skew(-8deg); }
  .cor.ativo { border-color: var(--y); box-shadow: 3px 3px 0 var(--pink); }
  .cores input[type=color] { width: 34px; height: 34px; padding: 0; cursor: pointer; border: 2px solid var(--line); }
  .arquivo { display: flex; gap: 8px; } .arquivo > * { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 26px; border: 0; font-family: 'Anton'; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; background: var(--y); color: #000; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: .2s; }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }
  .btn:hover { background: var(--g); transform: translateY(-2px); }
  .btn.sec { background: transparent; color: var(--txt); box-shadow: inset 0 0 0 2px var(--txt); font-size: 15px; padding: 10px 14px; }
  .btn.sec:hover { background: var(--txt); color: #000; }
  #logo { display: none; }
  .palco { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; min-width: 0; position: relative; }
  .palco::before { content: "PREVIEW // 300 DPI"; position: absolute; top: 18px; left: 24px; font-family: 'JetBrains Mono'; font-size: 11px; color: var(--mut); }
  #c { max-width: 100%; max-height: calc(100vh - 210px); box-shadow: 10px 10px 0 var(--y), 0 20px 60px #000a; }
  .acoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .dica { font-family: 'JetBrains Mono'; color: var(--mut); font-size: 11px; }
  .dica b { color: var(--pink); font-weight: 400; }
  @media (max-width: 860px) {
    body { height: auto; overflow: visible; }
    header { position: sticky; top: 0; z-index: 20; padding: 12px 16px; }
    header h1 { font-size: 22px; }
    header span { display: none; }
    main { flex-direction: column; }
    .palco { order: -1; padding: 28px 16px 18px; gap: 14px; border-bottom: 2px solid var(--line); }
    .palco::before { top: 8px; left: 16px; }
    #c { max-height: 58vh; box-shadow: 6px 6px 0 var(--y), 0 10px 30px #000a; }
    .acoes { width: 100%; flex-wrap: wrap; }
    .acoes .btn { flex: 1; padding: 14px 10px !important; font-size: 17px !important; }
    aside { width: 100%; border-right: 0; padding: 16px; overflow: visible; }
    input, select { font-size: 16px; padding: 13px 12px; }
    .toggle { padding: 4px 0; }
    .cor { width: 38px; height: 38px; }
    .modelos { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .modelo { font-size: 9px; padding: 4px; }
  }
  @media print {
    header, aside, .acoes, .dica, .palco::before { display: none !important; }
    body::before, body::after { display: none; }
    body, .palco { background: #fff; height: auto; padding: 0; overflow: visible; }
    #c { max-height: none; width: 100%; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
  <h1>Plaquinha <b>Wi-Fi</b></h1><span><i></i>FAZ ACONTECER // GERADOR DE PLACAS</span>
</header>
<main>
<aside>
  <section>
    <h2>Clientes</h2>
    <label>Cliente salvo<select id="clientes"></select></label>
    <div class="arquivo">
      <button class="btn sec" id="salvarCliente"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>Salvar</button>
      <button class="btn sec" id="excluirCliente"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Excluir</button>
    </div>
  </section>
  <section>
    <h2>Modelo</h2>
    <div class="modelos" id="modelos"></div>
  </section>
  <section>
    <h2>Comércio</h2>
    <label>Nome do comércio<input id="nome" value="Meu Comércio"></label>
    <label>Título<input id="titulo" value="Wi-Fi Grátis"></label>
    <label>Rodapé<input id="rodape" value="Aponte a câmera do celular para conectar"></label>
  </section>
  <section>
    <h2>Rede</h2>
    <label>Nome da rede (SSID)<input id="ssid" value="MinhaRede"></label>
    <label>Senha<input id="senha" value="12345678"></label>
    <label>Segurança
      <select id="tipo"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">Sem senha</option></select>
    </label>
    <label class="toggle">Mostrar senha escrita<input type="checkbox" id="mostrarSenha" checked></label>
    <label class="toggle">Rede oculta<input type="checkbox" id="oculta"></label>
  </section>
  <section>
    <h2>Aparência</h2>
    <div class="cores" id="cores"><input type="color" id="cor" value="#1f8a4c" title="Cor personalizada"></div>
    <label class="toggle">Tema escuro (modelo Moderno)<input type="checkbox" id="escuro"></label>
    <div class="arquivo">
      <label class="btn sec" for="logo"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Enviar logo</label>
      <button class="btn sec" id="removerLogo"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Remover</button>
    </div>
    <input type="file" id="logo" accept="image/*">
    <label class="toggle">Logo no meio do QR<input type="checkbox" id="logoQR" checked></label>
  </section>
</aside>
<div class="palco">
  <canvas id="c"></canvas>
  <div class="acoes">
    <button class="btn" id="baixar"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Baixar PNG</button>
    <button class="btn sec" id="pdfGrafica" style="font-size:18px;padding:12px 26px"><svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/></svg>PDF gráfica</button>
    <button class="btn sec" id="folhaA4" style="font-size:18px;padding:12px 26px"><svg viewBox="0 0 24 24"><path d="M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z"/></svg>Folha A4</button>
    <button class="btn sec" id="compartilhar" style="font-size:18px;padding:12px 26px;display:none"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>Compartilhar</button>
    <button class="btn sec" id="imprimir" style="font-size:18px;padding:12px 26px"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>Imprimir</button>
  </div>
  <div class="dica">EXPORTA EM 300 DPI // <b>TESTE O QR NO CELULAR ANTES DE IMPRIMIR</b></div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const cv = $('c');
let ctx, logoImg = null, modelo = 'moderno';

const P = {
  wifi: 'M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.760 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z',
  lock: 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z',
  camera: 'M12 8.8a3.2 3.2 0 1 0 0 6.4a3.2 3.2 0 1 0 0-6.4zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z',
  phone: 'M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z'
};
const CORES = ['#1f8a4c', '#2563eb', '#7c3aed', '#db2777', '#dc2626', '#ea580c', '#b8860b', '#0f766e', '#111827'];

// ---------- utilidades ----------
function D() {
  return {
    nome: $('nome').value, titulo: $('titulo').value, rodape: $('rodape').value,
    ssid: $('ssid').value.trim(), senha: $('senha').value.trim(), tipo: $('tipo').value,
    mostra: $('mostrarSenha').checked && $('tipo').value !== 'nopass',
    cor: $('cor').value, escuro: $('escuro').checked, logoQR: !!logoImg && $('logoQR').checked
  };
}
function esc(s) { return s.replace(/([\\;,:"])/g, '\\$1'); }
function wifiString(d) {
  let s = 'WIFI:T:' + d.tipo + ';S:' + esc(d.ssid) + ';';
  if (d.tipo !== 'nopass') s += 'P:' + esc(d.senha) + ';';
  if ($('oculta').checked) s += 'H:true;';
  return s + ';';
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function F(weight, size, fam) { return weight + ' ' + size + 'px ' + (fam || 'Montserrat, "Segoe UI", Arial'); }
function fit(txt, max, size, weight, fam) {
  do { ctx.font = F(weight, size, fam); size -= 2; } while (ctx.measureText(txt).width > max && size > 16);
}
function texto(txt, x, y, max, size, weight, color, fam) { fit(txt, max, size, weight, fam); ctx.fillStyle = color; ctx.fillText(txt, x, y); }
function icone(path, cx, cy, s, color) {
  ctx.save(); ctx.translate(cx - s / 2, cy - s / 2); ctx.scale(s / 24, s / 24);
  ctx.fillStyle = color; ctx.fill(new Path2D(path)); ctx.restore();
}
function tom(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function degrade(d, x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, tom(d.cor, 1.25)); g.addColorStop(1, tom(d.cor, 0.7)); return g;
}
function qrDesenho(d, x, y, s, fg) {
  const qr = qrcode(0, d.logoQR ? 'H' : 'M'); qr.addData(wifiString(d)); qr.make();
  const n = qr.getModuleCount(), cell = s / n;
  ctx.fillStyle = fg || '#111';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + c * cell), Math.floor(y + r * cell), Math.ceil(cell), Math.ceil(cell));
  if (d.logoQR) {
    const L = s * 0.22, cx = x + s / 2, cy = y + s / 2;
    ctx.fillStyle = '#fff'; rr(cx - L / 2 - s * 0.02, cy - L / 2 - s * 0.02, L + s * 0.04, L + s * 0.04, s * 0.03); ctx.fill();
    const k = Math.min(L / logoImg.width, L / logoImg.height);
    ctx.drawImage(logoImg, cx - logoImg.width * k / 2, cy - logoImg.height * k / 2, logoImg.width * k, logoImg.height * k);
  }
}
function cartaoQR(d, x, y, s, pad, raio, borda) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  ctx.fillStyle = '#fff'; rr(x - pad, y - pad, s + pad * 2, s + pad * 2, raio); ctx.fill(); ctx.restore();
  if (borda) { ctx.strokeStyle = d.cor; ctx.lineWidth = 8; rr(x - pad, y - pad, s + pad * 2, s + pad * 2, raio); ctx.stroke(); }
  qrDesenho(d, x, y, s);
}
function selo(d, cx, cy, escala) {
  const k = escala || 1, sh = 76 * k, sw = 420 * k;
  ctx.fillStyle = d.cor; rr(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); ctx.fill();
  ctx.font = F(800, 36 * k); ctx.textAlign = 'center';
  const tw = ctx.measureText('ESCANEIE AQUI').width;
  icone(P.camera, cx - tw / 2 - 12 * k, cy, 44 * k, '#fff');
  ctx.fillStyle = '#fff'; ctx.fillText('ESCANEIE AQUI', cx + 26 * k, cy + 13 * k);
}
function caixaInfo(x, y, w, rotulo, valor, path, cor, fundo, cRot, cVal) {
  const h = 150;
  ctx.fillStyle = fundo; rr(x, y, w, h, 36); ctx.fill();
  ctx.fillStyle = cor; rr(x + 22, y + 22, h - 44, h - 44, 26); ctx.fill();
  icone(path, x + h / 2, y + h / 2, 60, '#fff');
  ctx.textAlign = 'left';
  ctx.font = F(600, 34); ctx.fillStyle = cRot; ctx.fillText(rotulo.toUpperCase(), x + h + 10, y + 58);
  texto(valor, x + h + 10, y + 120, w - h - 40, 56, 700, cVal);
  ctx.textAlign = 'center';
}
function rodapeTexto(d, cx, cy, max, size, color) {
  fit(d.rodape, max - size * 1.6, size, 600);
  const rw = ctx.measureText(d.rodape).width;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(d.rodape, cx + size * 0.75, cy + size * 0.35);
  icone(P.phone, cx - rw / 2 - size * 0.25, cy, size * 1.2, color);
}
function logoOuIcone(d, cx, cy, h, color) {
  if (logoImg && !d.logoQR) {
    const k = Math.min(h / logoImg.height, (h * 3.4) / logoImg.width);
    ctx.drawImage(logoImg, cx - logoImg.width * k / 2, cy - logoImg.height * k / 2, logoImg.width * k, logoImg.height * k);
  } else icone(P.wifi, cx, cy, h, color);
}

// ---------- modelos ----------
const MODELOS = {
  moderno: { nome: 'Moderno', w: 1240, h: 1748, draw(d, W, H) {
    // fundo inteiro na cor, cartão branco grande com o QR e as informações
    ctx.fillStyle = d.escuro ? '#14161c' : degrade(d, 0, 0, W, H); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.arc(W - 80, 120, 300, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(60, H - 260, 240, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center';
    logoOuIcone(d, W / 2, 160, 150, d.escuro ? d.cor : '#fff');

    texto(d.nome, W / 2, 445, W - 160, 56, 600, 'rgba(255,255,255,0.8)');
    const cy0 = 520, cy1 = H - 140;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 16;
    ctx.fillStyle = d.escuro ? '#1f232b' : '#fff'; rr(90, cy0, W - 180, cy1 - cy0, 60); ctx.fill(); ctx.restore();
    const s = 600, qy = cy0 + 70;
    if (d.escuro) { ctx.fillStyle = '#fff'; rr((W - s) / 2 - 30, qy - 30, s + 60, s + 60, 30); ctx.fill(); }

    const fb = d.escuro ? '#2a2f39' : '#f3f5f8', cr = d.escuro ? '#9aa3b2' : '#7a8290', cv2 = d.escuro ? '#fff' : '#111';

  }},

  minimalista: { nome: 'Minimalista', w: 1240, h: 1748, draw(d, W, H) {

    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, W, H);

    const orn = y => { ctx.fillStyle = d.cor; ctx.fillRect(W / 2 - 200, y, 150, 2); ctx.fillRect(W / 2 + 50, y, 150, 2);
      ctx.save(); ctx.translate(W / 2, y + 1); ctx.rotate(Math.PI / 4); ctx.fillRect(-9, -9, 18, 18); ctx.restore(); };
    orn(270);

  balcao: { nome: 'Balcão', w: 1748, h: 1240, draw(d, W, H) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'left';
    if (logoImg && !d.logoQR) {

    } else icone(P.wifi, 160, 150, 120, '#fff');
    texto(d.nome, 100, 330, pw - 200, 56, 600, 'rgba(255,255,255,0.85)');
    texto(d.titulo, 100, 450, pw - 200, 120, 800, '#fff');
    const fb = 'rgba(255,255,255,0.15)';
    caixaInfo(100, 560, pw - 200, 'Rede', d.ssid, P.wifi, 'rgba(0,0,0,0.25)', fb, 'rgba(255,255,255,0.75)', '#fff');
    if (d.mostra) caixaInfo(100, 740, pw - 200, 'Senha', d.senha, P.lock, 'rgba(0,0,0,0.25)', fb, 'rgba(255,255,255,0.75)', '#fff');
    ctx.textAlign = 'left'; fit(d.rodape, pw - 260, 34, 600); ctx.fillStyle = '#fff';
    icone(P.phone, 125, H - 120, 46, '#fff'); ctx.fillText(d.rodape, 165, H - 108);
    const s = 560, cx = pw + (W - pw) / 2 + 30, qy = (H - s) / 2 + 30;
    cartaoQR(d, cx - s / 2, qy, s, 46, 44, true);
    selo(d, cx, qy - 46, 0.9);
  }},

  cartao: { nome: 'Cartão', w: 1240, h: 1240, draw(d, W, H) {
    ctx.fillStyle = degrade(d, 0, 0, W, H); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; rr(60, 60, W - 120, H - 120, 60); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = F(800, 72); const tw = ctx.measureText(d.titulo).width;
    fit(d.titulo, W - 340, 72, 800); ctx.fillStyle = '#111'; ctx.fillText(d.titulo, W / 2 + 45, 200);
    icone(P.wifi, W / 2 - Math.min(tw, W - 340) / 2 - 30, 175, 80, d.cor);
    const s = 680; qrDesenho(d, (W - s) / 2, 260, s);
    const info = d.mostra ? d.ssid + '  •  ' + d.senha : d.ssid;
    ctx.fillStyle = d.cor; rr(140, 990, W - 280, 110, 55); ctx.fill();

  }},

  // plaquinha genérica pra levar pronta: o QR entra depois como etiqueta colada no quadrado
  base: { nome: 'Base', w: 1240, h: 1748, draw(d, W, H) {
    const g = degrade(d, 0, 0, W, 460);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 400);
    ctx.bezierCurveTo(W * 0.7, 500, W * 0.3, 360, 0, 450); ctx.closePath(); ctx.fill();
    ctx.textAlign = 'center';
    logoOuIcone({ ...d, logoQR: false }, W / 2, 145, 160, '#fff');
    texto(d.titulo, W / 2, 330, W - 160, 112, 800, '#fff');
    const s = 650, qx = (W - s) / 2, qy = 640; // 650 px = 55 mm, cabe a etiqueta de 50 mm com folga
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    ctx.fillStyle = '#fff'; rr(qx - 50, qy - 50, s + 100, s + 100, 48); ctx.fill(); ctx.restore();
    ctx.strokeStyle = d.cor; ctx.lineWidth = 8; rr(qx - 50, qy - 50, s + 100, s + 100, 48); ctx.stroke();
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 4; ctx.setLineDash([22, 16]); ctx.strokeRect(qx, qy, s, s); ctx.setLineDash([]);
    icone(P.camera, W / 2, qy + s / 2 - 30, 110, '#e3e6eb');
    ctx.font = F(600, 30); ctx.fillStyle = '#b3b9c3'; ctx.fillText('QR CODE AQUI', W / 2, qy + s / 2 + 70);
    selo(d, W / 2, qy - 50);
    const passo = (y, path, n, txt) => {
      ctx.fillStyle = d.cor; ctx.beginPath(); ctx.arc(200, y, 52, 0, Math.PI * 2); ctx.fill();
      icone(path, 200, y, 56, '#fff');
      ctx.textAlign = 'left'; ctx.font = F(700, 30); ctx.fillStyle = d.cor; ctx.fillText('PASSO ' + n, 290, y - 14);
      texto(txt, 290, y + 34, W - 400, 46, 700, '#1c1f26'); ctx.textAlign = 'center';
    };
    passo(1440, P.camera, 1, 'Abra a câmera do celular');
    passo(1570, P.wifi, 2, 'Toque no aviso e conecte');
    ctx.fillStyle = g; ctx.fillRect(0, H - 90, W, 90);
    ctx.font = F(700, 34); ctx.fillStyle = '#fff'; ctx.fillText('Wi-Fi grátis para clientes', W / 2, H - 33);
  }},

  // etiqueta 50x50 mm pra impressora térmica (Phomemo e afins): só preto e branco, sem logo
  etiqueta: { nome: 'Etiqueta', w: 591, h: 591, draw(d, W, H) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    const s = d.mostra ? 430 : 470, qx = (W - s) / 2;
    qrDesenho({ ...d, logoQR: false }, qx, 16, s, '#000');

    if (d.mostra) {
      texto(d.ssid, W / 2, s + 66, W - 30, 40, 800, '#000');

};
// versões em folha A4 inteira (300 dpi): o mesmo desenho ampliado 2x
const A4 = (nome, base, w, h) => ({ nome, w, h, draw(d) {
  ctx.save(); ctx.scale(2, 2); MODELOS[base].draw(d, w / 2, h / 2); ctx.restore();
}});
MODELOS.a4moderno = A4('A4 Moderno', 'moderno', 2480, 3508);
MODELOS.a4elegante = A4('A4 Elegante', 'elegante', 2480, 3508);
MODELOS.a4minimal = A4('A4 Minimal', 'minimalista', 2480, 3508);
MODELOS.a4deitado = A4('A4 Deitado', 'balcao', 3508, 2480);

// ---------- renderização ----------
function render(nomeModelo, canvas) {
  const m = MODELOS[nomeModelo], prev = ctx;
  canvas.width = m.w; canvas.height = m.h; ctx = canvas.getContext('2d');
  ctx.textAlign = 'center'; m.draw(D(), m.w, m.h); ctx = prev;
}
const miniaturas = {};
Object.keys(MODELOS).forEach(k => {
  const div = document.createElement('div'); div.className = 'modelo' + (k === modelo ? ' ativo' : '');
  const c = document.createElement('canvas'); div.append(c, MODELOS[k].nome);
  div.dataset.k = k; div.onclick = () => setModelo(k);
  $('modelos').append(div); miniaturas[k] = c;
});
CORES.forEach(hex => {
  const b = document.createElement('div'); b.className = 'cor' + (hex === $('cor').value ? ' ativo' : ''); b.style.background = hex;
  b.onclick = () => { $('cor').value = hex; marcarCor(); atualizar(); };
  $('cores').insertBefore(b, $('cor'));
});
function marcarCor() { document.querySelectorAll('.cor').forEach(b => b.classList.toggle('ativo', b.style.background === tom($('cor').value, 1))); }

let tMini;
function atualizar() {
  render(modelo, cv);
  clearTimeout(tMini);
  tMini = setTimeout(() => Object.keys(miniaturas).forEach(k => render(k, miniaturas[k])), 250);
}

document.querySelectorAll('aside input, aside select').forEach(el => el.addEventListener('input', () => { if (el.id === 'cor') marcarCor(); atualizar(); }));
function setModelo(k) {
  modelo = k;
  document.querySelectorAll('.modelo').forEach(e => e.classList.toggle('ativo', e.dataset.k === k));
  atualizar();
}

// ---------- logo (guardado como dataURL reduzido pra poder salvar no cliente) ----------
let logoData = null;
function usarLogo(data) {
  logoData = data;
  if (!data) { logoImg = null; return atualizar(); }
  const img = new Image(); img.onload = () => { logoImg = img; atualizar(); }; img.src = data;
}
$('logo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
    tirarFundo(x, c.width, c.height);
    usarLogo(c.toDataURL('image/png'));
  };
  img.src = URL.createObjectURL(f);
});
// logo de JPG ou com fundo chapado: apaga o fundo a partir das bordas pra ficar transparente
function tirarFundo(x, w, h) {
  const im = x.getImageData(0, 0, w, h), p = im.data;
  const cant = [0, w - 1, (h - 1) * w, h * w - 1].map(i => i * 4);
  if (cant.some(i => p[i + 3] < 250)) return; // já tem transparência
  const [r, g, b] = [p[cant[0]], p[cant[0] + 1], p[cant[0] + 2]];
  const dist = i => Math.abs(p[i] - r) + Math.abs(p[i + 1] - g) + Math.abs(p[i + 2] - b);
  if (cant.some(i => dist(i) > 60)) return; // fundo não é uniforme
  const vis = new Uint8Array(w * h), pilha = [];
  for (let i = 0; i < w; i++) pilha.push(i, (h - 1) * w + i);
  for (let j = 0; j < h; j++) pilha.push(j * w, j * w + w - 1);
  while (pilha.length) {
    const k = pilha.pop(); if (vis[k]) continue; vis[k] = 1;
    const dd = dist(k * 4); if (dd > 90) continue;
    p[k * 4 + 3] = dd < 45 ? 0 : Math.round(255 * (dd - 45) / 45); // borda suave
    if (dd >= 45) continue;
    const cx = k % w;
    if (cx > 0) pilha.push(k - 1); if (cx < w - 1) pilha.push(k + 1);
    if (k >= w) pilha.push(k - w); if (k < w * (h - 1)) pilha.push(k + w);
  }
  x.putImageData(im, 0, 0);
}
$('removerLogo').onclick = () => { $('logo').value = ''; usarLogo(null); };

// ---------- clientes salvos ----------
const KEY = 'plaquinha-clientes';
const TEXTOS = ['nome', 'titulo', 'rodape', 'ssid', 'senha', 'tipo', 'cor'];
const CHECKS = ['mostrarSenha', 'oculta', 'escuro', 'logoQR'];
const lerClientes = () => JSON.parse(localStorage.getItem(KEY) || '{}');
function listarClientes(sel) {
  const cs = lerClientes();
  $('clientes').innerHTML = '<option value="">— novo cliente —</option>' +
    Object.keys(cs).sort().map(n => '<option>' + n.replace(/</g, '&lt;') + '</option>').join('');
  $('clientes').value = sel || '';
}
$('salvarCliente').onclick = () => {
  const nome = $('nome').value.trim() || 'Sem nome', cs = lerClientes(), o = { modelo, logo: logoData };
  TEXTOS.forEach(id => o[id] = $(id).value); CHECKS.forEach(id => o[id] = $(id).checked);
  cs[nome] = o;
  try { localStorage.setItem(KEY, JSON.stringify(cs)); listarClientes(nome); }
  catch (e) { alert('Sem espaço pra salvar. Exclua alguns clientes ou use um logo menor.'); }
};
$('excluirCliente').onclick = () => {
  const n = $('clientes').value; if (!n || !confirm('Excluir o cliente "' + n + '"?')) return;
  const cs = lerClientes(); delete cs[n]; localStorage.setItem(KEY, JSON.stringify(cs)); listarClientes();
};
$('clientes').addEventListener('change', () => {
  const o = lerClientes()[$('clientes').value]; if (!o) return;
  TEXTOS.forEach(id => { if (o[id] !== undefined) $(id).value = o[id]; });
  CHECKS.forEach(id => { if (o[id] !== undefined) $(id).checked = o[id]; });
  marcarCor(); modelo = o.modelo || 'moderno'; setModelo(modelo); usarLogo(o.logo || null);
});
listarClientes();

// ---------- PDF ----------
const MM = px => px / 300 * 25.4, SANGRIA = 36; // 36 px ≈ 3 mm a 300 dpi
const nomeArq = ext => 'plaquinha-' + modelo + '-' + ($('nome').value || 'wifi').replace(/[^\w-]+/g, '_') + ext;
function comSangria() {
  const B = SANGRIA, w = cv.width, h = cv.height, c = document.createElement('canvas');
  c.width = w + 2 * B; c.height = h + 2 * B; const x = c.getContext('2d');
  // estica a borda da arte pra fora, assim o corte da gráfica nunca deixa filete branco
  x.drawImage(cv, 0, 0, 1, h, 0, B, B, h); x.drawImage(cv, w - 1, 0, 1, h, w + B, B, B, h);
  x.drawImage(cv, 0, 0, w, 1, B, 0, w, B); x.drawImage(cv, 0, h - 1, w, 1, B, h + B, w, B);
  x.drawImage(cv, 0, 0, 1, 1, 0, 0, B, B); x.drawImage(cv, w - 1, 0, 1, 1, w + B, 0, B, B);
  x.drawImage(cv, 0, h - 1, 1, 1, 0, h + B, B, B); x.drawImage(cv, w - 1, h - 1, 1, 1, w + B, h + B, B, B);
  x.drawImage(cv, B, B); return c;
}
$('pdfGrafica').onclick = () => {
  const { jsPDF } = window.jspdf, tw = MM(cv.width), th = MM(cv.height), b = MM(SANGRIA), m = 6;
  const pw = tw + 2 * (b + m), ph = th + 2 * (b + m);
  const doc = new jsPDF({ unit: 'mm', format: [pw, ph], orientation: pw > ph ? 'landscape' : 'portrait' });
  doc.addImage(comSangria().toDataURL('image/jpeg', 0.95), 'JPEG', m, m, tw + 2 * b, th + 2 * b);
  doc.setLineWidth(0.25); doc.setDrawColor(0);
  [m + b, m + b + tw].forEach(x => { doc.line(x, 0, x, m - 1); doc.line(x, ph - m + 1, x, ph); });
  [m + b, m + b + th].forEach(y => { doc.line(0, y, m - 1, y); doc.line(pw - m + 1, y, pw, y); });
  doc.save(nomeArq('-grafica.pdf'));
};
$('folhaA4').onclick = () => {
  const { jsPDF } = window.jspdf, tw = MM(cv.width), th = MM(cv.height), cabe = (W, H) => Math.floor((W + 0.5) / tw) * Math.floor((H + 0.5) / th);
  const deitada = cabe(297, 210) > cabe(210, 297), W = deitada ? 297 : 210, H = deitada ? 210 : 297;
  const cols = Math.floor((W + 0.5) / tw), rows = Math.floor((H + 0.5) / th), x0 = (W - cols * tw) / 2, y0 = (H - rows * th) / 2;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: deitada ? 'landscape' : 'portrait' });
  const img = cv.toDataURL('image/jpeg', 0.95);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    doc.addImage(img, 'JPEG', x0 + c * tw, y0 + r * th, tw, th, 'arte');
  // linhas de corte tracejadas nas margens
  doc.setLineWidth(0.2); doc.setDrawColor(150); doc.setLineDashPattern([1.5, 1.5], 0);
  for (let c = 0; c <= cols; c++) { const x = x0 + c * tw; if (y0 > 1) { doc.line(x, 0, x, y0 - 1); doc.line(x, H - y0 + 1, x, H); } }
  for (let r = 0; r <= rows; r++) { const y = y0 + r * th; if (x0 > 1) { doc.line(0, y, x0 - 1, y); doc.line(W - x0 + 1, y, W, y); } }
  doc.save(nomeArq('-folha-A4.pdf'));
};
$('baixar').onclick = () => {
  const a = document.createElement('a');
  a.download = 'plaquinha-' + modelo + '-' + ($('nome').value || 'wifi').replace(/[^\w-]+/g, '_') + '.png';
  a.href = cv.toDataURL('image/png'); a.click();
};
$('imprimir').onclick = () => window.print();
if (navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })) {
  $('compartilhar').style.display = '';
  $('compartilhar').onclick = () => cv.toBlob(b => {
    const nome = 'plaquinha-' + modelo + '-' + ($('nome').value || 'wifi').replace(/[^\w-]+/g, '_') + '.png';
    navigator.share({ files: [new File([b], nome, { type: 'image/png' })], title: 'Plaquinha Wi-Fi' }).catch(() => {});
  }, 'image/png');
}

atualizar();
document.fonts.load('800 40px Montserrat').then(() => document.fonts.load('700 40px "Playfair Display"')).then(() => document.fonts.ready).then(atualizar);
